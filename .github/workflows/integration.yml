name: Content and Analytics integration
on:
  pull_request:
  push:
    branches: [integration/content-analytics-loop]
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:content
      - run: npm test -- --maxWorkers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: content-handoff-traces
          path: test-results/*trace.json
